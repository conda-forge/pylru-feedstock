{% set name = "pylru" %}
{% set version = "1.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 1a16ddbcab2f1b7294f76da70a3ffb3a0fe11907340002fb5cc0565d446d88e2

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - pylru

about:
  home: https://github.com/jlhutch/pylru
  license: GPL-2.0
  license_file: LICENSE.txt
  summary: A least recently used (LRU) cache implementation

extra:
  recipe-maintainers:
    - nehaljwani
